<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güvenli Takas V5 · Katılımcı</title><style>:root{font:16px/1.5 system-ui;color-scheme:dark;background:#0b1524;color:#eef5ff}body{max-width:650px;margin:auto;padding:24px}section{background:#182b42;border:1px solid #3c5873;border-radius:18px;padding:20px;margin:18px 0}button{width:100%;padding:15px;background:#477bea;color:#fff;border:0;border-radius:10px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1828;padding:14px;border-radius:10px}p{color:#bfd0e2}</style></head><body><h1>Güvenli Takas V5</h1><p>Nile test ağı · Katılımcı bağlantısı</p><section><h2 id="role">Katılımcı</h2><pre id="info"></pre><button id="read">Takas durumunu salt okunur kontrol et</button><pre id="status">Henüz sorgulanmadı.</pre></section><section><strong>Bu ön izleme para yatırmaz.</strong><p>V5 Nile sözleşmesi doğrulanıp katılımcı işlemleri etkinleştirilmeden cüzdanınızdan imza istenmez. Davet bağlantısı tek başına yetki vermez.</p></section><script>
const q=new URLSearchParams(location.search),addr=q.get('contract')||'',id=Number(q.get('id')),role=q.get('role')||'?';
document.getElementById('role').textContent='Taraf '+role;
document.getElementById('info').textContent='Takas: '+(Number.isSafeInteger(id)&&id>0?id:'Belirlenmedi')+'\nSözleşme: '+(addr||'Belirlenmedi');
document.getElementById('read').onclick=async()=>{const out=document.getElementById('status');try{const t=window.tronLink?.tronWeb||window.tronWeb;if(!t)throw Error('TronLink bulunamadı');if(!(t.fullNode?.host||'').toLowerCase().includes('nile'))throw Error('TronLink ağını Nile seçin');if(!t.isAddress(addr)||!Number.isSafeInteger(id)||id<1)throw Error('Davet bağlantısı eksik');const c=await t.trx.getContract(addr);if(!c?.contract_address)throw Error('Sözleşme bulunamadı');const names=(c.abi?.entrys||[]).map(x=>x.name);if(!['getSwap','termsHash','refund'].every(x=>names.includes(x)))throw Error('V5 sözleşme arayüzü doğrulanamadı');out.textContent='Nile sözleşmesi bulundu. Takas #'+id+'\nSözleşme arayüzü doğrulandı; bu kontrol takasın varlığını veya fon güvenliğini kanıtlamaz.\nHenüz para yatırma işlemi açık değil.'}catch(e){out.textContent='Kontrol başarısız: '+e.message}};
const abi=[{type:'function',name:'propose',inputs:[{type:'uint256'},{type:'address'},{type:'uint256'}],outputs:[]},{type:'function',name:'proposeAndAcceptA',inputs:[{type:'uint256'},{type:'address'},{type:'uint256'},{type:'bytes32'}],outputs:[]},{type:'function',name:'offerAHash',stateMutability:'view',inputs:[{type:'uint256'}],outputs:[{type:'bytes32'}]},{type:'function',name:'termsHash',stateMutability:'view',inputs:[{type:'uint256'}],outputs:[{type:'bytes32'}]},{type:'function',name:'acceptAndDeposit',inputs:[{type:'uint256'},{type:'bytes32'}],outputs:[],stateMutability:'payable'},{type:'function',name:'deposit',inputs:[{type:'uint256'}],outputs:[],stateMutability:'payable'},{type:'function',name:'refund',inputs:[{type:'uint256'}],outputs:[]},{type:'function',name:'getSwap',stateMutability:'view',inputs:[{type:'uint256'}],outputs:[{type:'tuple',components:['partyA','partyB','tokenA','tokenB','amountA','amountB','offerDeadline','depositDeadline','settlementDeadline','feeBps','feePayer','walletsConfirmed','proposedA','proposedB','acceptedA','acceptedB','depositedA','depositedB','refundedA','refundedB','completed','cancelled'].map((name,i)=>({name,type:i<4?'address':i<6?'uint256':i<9?'uint64':i===9?'uint16':i===10?'uint8':'bool'}))}]}];
const zero='4100000000000000000000000000000000000000';
async function run(op){const out=document.getElementById('action');try{const t=window.tronLink?.tronWeb||window.tronWeb;if(!t?.defaultAddress?.base58)throw Error('TronLink cüzdanını bağlayın');if(!(t.fullNode?.host||'').toLowerCase().includes('nile'))throw Error('Nile ağını seçin');if(!t.isAddress(addr)||!Number.isSafeInteger(id)||id<1)throw Error('Bağlantı geçersiz');const meta=await t.trx.getContract(addr);const functions=(meta.abi?.entrys||[]).map(x=>x.name);if(!['getSwap','offerAHash','termsHash','acceptAndDeposit','deposit','refund'].every(x=>functions.includes(x)))throw Error('V5 sözleşmesi doğrulanamadı');const c=await t.contract(abi,addr),s=await c.getSwap(id).call();const wallet=t.defaultAddress.base58;const party=t.address.fromHex(role==='A'?s.partyA:s.partyB);if(party!==wallet)throw Error('Bu bağlantıdaki tarafın cüzdanı bağlı değil');if(!s.walletsConfirmed||s.completed||s.cancelled)throw Error('Takas aktif değil');const token=document.getElementById('token').value.trim();const tokenHex=token?t.address.toHex(token):zero;const amount=document.getElementById('amount').value.trim();if(['propose','bAccept'].includes(op)&&(!/^\d+$/.test(amount)||BigInt(amount)<=0n||token&&!t.isAddress(token)))throw Error('Token ve en küçük birim miktarını kontrol edin');let tx;if(op==='propose'){if(role!=='A')throw Error('A bağlantısı gerekli');tx=await c.propose(id,tokenHex,amount).send({feeLimit:100000000});}else if(op==='bAccept'){if(role!=='B')throw Error('B bağlantısı gerekli');const hash=await c.offerAHash(id).call();tx=await c.proposeAndAcceptA(id,tokenHex,amount,hash).send({feeLimit:100000000});}else if(op==='aDeposit'){if(role!=='A')throw Error('A bağlantısı gerekli');const hash=await c.termsHash(id).call();const val=t.address.toHex(s.tokenA)===zero?Number(s.amountA):0;if(!Number.isSafeInteger(val))throw Error('TRX miktarı çok büyük');if(!confirm('A yatırımı: '+String(s.amountA)+' en küçük birim; B yatırımı: '+String(s.amountB)+' en küçük birim. Komisyon: '+String(s.feeBps)+' baz puan, ödeyen: '+String(s.feePayer)+'. Token adreslerini ve miktarları kontrol ettiniz mi?'))return;tx=await c.acceptAndDeposit(id,hash).send({callValue:val,feeLimit:100000000});}else if(op==='bDeposit'){if(role!=='B')throw Error('B bağlantısı gerekli');const val=t.address.toHex(s.tokenB)===zero?Number(s.amountB):0;if(!Number.isSafeInteger(val))throw Error('TRX miktarı çok büyük');if(!confirm('B yatırımı: '+String(s.amountB)+' en küçük birim. Token: '+String(s.tokenB)+'. Bu miktarı doğruladınız mı?'))return;tx=await c.deposit(id).send({callValue:val,feeLimit:100000000});}else{tx=await c.refund(id).send({feeLimit:100000000})}out.textContent='İşlem gönderildi: '+tx+'\nZincir onayı için Tronscan üzerinden kontrol edin.'}catch(e){out.textContent='İşlem yapılamadı: '+(e.message||e)}}
document.getElementById('propose').onclick=()=>run('propose');document.getElementById('bAccept').onclick=()=>run('bAccept');document.getElementById('aDeposit').onclick=()=>run('aDeposit');document.getElementById('bDeposit').onclick=()=>run('bDeposit');document.getElementById('refund').onclick=()=>run('refund');
</script><section><h2>Teklif ve onay</h2><label>Token (TRX için boş bırak)</label><input id="token" placeholder="TRC20 sözleşme adresi veya boş"><label>Miktar (tokenın en küçük birimi)</label><input id="amount" placeholder="Örneğin TRX için 1000000 = 1 TRX"><button id="propose">A: Teklifimi kaydet</button><button id="bAccept">B: Teklifimi kaydet ve A'yı kabul et</button><button id="aDeposit">A: Son şartları kabul et ve yatır</button><button id="bDeposit">B: Yatır</button><button id="refund">Süre dolduysa paramı iade al</button><pre id="action">İşlem yapılmadı.</pre></section></body></html>
