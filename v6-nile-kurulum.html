<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 Nile Kurulum</title><style>:root{font:16px system-ui;color:#f1f5ff;background:#0b1425}body{max-width:560px;margin:24px auto;padding:16px}section{background:#132139;border:1px solid #344765;border-radius:16px;padding:20px}button,input{font:inherit;width:100%;padding:14px;margin:10px 0;border-radius:10px}button{background:#3b82f6;color:white;border:0;font-weight:bold}button:disabled{background:#475569}input{background:#0b1425;color:white;border:1px solid #475569}p,small{line-height:1.5}#status{overflow-wrap:anywhere;color:#fde68a}a{color:#93c5fd}</style></head><body><h1>V6 · Nile Kurulum</h1><section><p>Yalnızca <b>Nile test ağı</b>. V6 sözleşmesi bir kez kurulacak. İşlemi yönetici cüzdanı imzalar.</p><button id="connect">Yönetici cüzdanını kontrol et</button><p id="wallet"></p><label><input type="checkbox" id="ack" style="width:auto"> Nile test TRX harcayacak sözleşme kurulumunu onaylıyorum. İşlem üst sınırı 200 TRX; gerçek maliyet daha az olabilir.</label><button id="deploy" disabled>V6 sözleşmesini Nile'a kur</button><p id="status" role="status"></p><div id="done" hidden><p><b>V6 sözleşme adresi:</b></p><input id="address" readonly><button id="copy">Adresi kopyala</button><a id="manager">V6 yönetici sayfasını aç</a></div></section><script>
const OWNER="TUrZ33TzHZrT3CAFmp54MDjh67KRq8WBYU";const $=x=>document.getElementById(x);let artifact=null,tw=null;function say(x){$("status").textContent=x}async function prepare(){if(!window.tronWeb?.ready)throw Error("Sayfayı TronLink tarayıcısında aç ve cüzdanı bağla.");const w=window.tronWeb;const host=String(w.fullNode?.host||w.fullNode?.url||"").toLowerCase();if(!host.includes("nile"))throw Error("TronLink ağını Nile Testnet seç.");if(w.defaultAddress?.base58!==OWNER)throw Error("Yönetici cüzdanı HD USDT #4 seçilmeli.");const res=await fetch("./v6-test/dist/TakasV6Simple.json",{cache:"no-store"});if(!res.ok)throw Error("V6 derleme dosyası henüz yayınlanmadı.");const a=await res.json();if(a.contractName!=="TakasV6Simple"||!Array.isArray(a.abi)||!/^[0-9a-fA-F]+$/.test(a.bytecode||""))throw Error("Derleme dosyası geçersiz.");w.setAddress(OWNER);tw=w;artifact=a;$("wallet").textContent="Bağlı yönetici: "+OWNER;$("deploy").disabled=true;say("GÜVENLİK DURDURMASI: Önceki kurulum 76,15 TRX harcayarak başarısız oldu. Gerçek dağıtım maliyeti doğrulanana kadar kurulum kapalı.");}
$("connect").onclick=async()=>{try{await prepare()}catch(e){say("Hata: "+e.message)}};
$("deploy").onclick=async()=>{try{throw Error("Güvenlik nedeniyle kurulum kapalı: maliyet doğrulanmadı.");if(!$("ack").checked)throw Error("Önce maliyet onay kutusunu işaretle.");await prepare();$("deploy").disabled=true;say("TronLink imzası bekleniyor. İşlemi yalnızca kabul ediyorsan imzala.");const issuer=tw.address.toHex(OWNER);if(!tw.isAddress(issuer))throw Error("Yönetici adresi geçersiz.");const unsigned=await tw.transactionBuilder.createSmartContract({abi:artifact.abi,bytecode:artifact.bytecode,feeLimit:200000000,callValue:0,userFeePercentage:100,originEnergyLimit:10000000,name:"TakasV6Simple"},issuer);if(!unsigned?.txID)throw Error("Kurulum işlemi hazırlanamadı.");const signed=await tw.trx.sign(unsigned);if(!signed?.signature?.length)throw Error("TronLink imzası alınamadı.");const broadcast=await tw.trx.sendRawTransaction(signed);if(!broadcast?.result)throw Error("Kurulum zincire gönderilemedi: "+JSON.stringify(broadcast));let info;for(let i=0;i<8;i++){info=await tw.trx.getTransactionInfo(unsigned.txID);if(info?.contract_address)break;await new Promise(resolve=>setTimeout(resolve,2500));}if(!info?.contract_address)throw Error("İşlem gönderildi: "+unsigned.txID+". Sözleşme adresi henüz oluşmadı; işlemi kontrol edin.");const addr=tw.address.fromHex(info.contract_address);if(!addr||!tw.isAddress(addr))throw Error("Sözleşme adresi alınamadı; işlemi kontrol et.");const onchain=await tw.contract(artifact.abi,addr);const owner=await onchain.manager().call();const normalized=tw.address.fromHex(String(owner).startsWith("41")?owner:tw.address.toHex(owner));if(normalized!==OWNER)throw Error("Kurulan sözleşmenin yöneticisi uyuşmuyor.");$("address").value=addr;$("manager").href="./v6-nile-yonetici.html?contract="+encodeURIComponent(addr);$("done").hidden=false;say("V6 Nile'a kuruldu ve yönetici doğrulandı.");}catch(e){say("Hata: "+(e.message||e))}finally{$("deploy").disabled=false}};
$("copy").onclick=()=>navigator.clipboard.writeText($("address").value).then(()=>say("Adres kopyalandı"));
</script></body></html>
