<!doctype html><html lang="tr"><head><title>V6 · Katılımcı</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font:16px system-ui;color:#edf4ff;background:#0b1425}body{max-width:560px;margin:30px auto;padding:16px}main{display:grid;gap:14px}section{padding:18px;border:1px solid #31435f;border-radius:16px;background:#132139}h1{font-size:1.6rem}h2{font-size:1.1rem}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #61718b}input,select{background:#0b1425;color:white}button{margin-top:12px;background:#3b82f6;color:white;font-weight:700;border:0}button:disabled{background:#475569}small{color:#cbd5e1;overflow-wrap:anywhere}#status{overflow-wrap:anywhere;color:#facc15}a{color:#93c5fd}</style></head><body><main><h1>Takas daveti</h1><section><strong>Sabit komisyonlu V6</strong><p id="feeInfo">Takas bilgileri yükleniyor...</p></section><section><h2 id="roleLabel">Katılımcı</h2><label>Göndereceğiniz varlık</label><select id="asset"><option value="TRX">TRX</option><option value="FRHN">FRHN (Nile test)</option><option value="OTHER">Diğer TRC20</option></select><div id="tokenWrap" hidden><label>Token sözleşme adresi</label><input id="token" placeholder="T ile başlayan token adresi"></div><label>Miktar</label><input id="amount" inputmode="decimal" placeholder="Örn. 5000000"><button id="deposit">Onayla ve yatır</button><small>TRC20 token için ilk kullanımda ayrı cüzdan izni gerekebilir.</small></section><section><button id="check">Takas durumunu görüntüle</button><p id="details"></p><button id="refund">Süre dolduysa yatırımı geri al</button></section><p id="status" role="status"></p></main><script src="v6-common.js"></script><script>const role=Number(qs.get("role")),id=qs.get("id");$("roleLabel").textContent=role===1?"A tarafı":role===2?"B tarafı":"Geçersiz davet";$("asset").onchange=()=>{$("tokenWrap").hidden=$("asset").value!=="OTHER"};async function run(fn){try{await fn()}catch(e){status("Hata: "+(e.message||e))}}async function showFee(){if(!id||![1,2].includes(role)||!fixedReady()){$("feeInfo").textContent="Geçerli takas daveti gerekli.";return;}const d=await(await contract()).getDeal(id).call();const fee=BigInt(d.feeAmount.toString());$("feeInfo").textContent=fee>0n&&Number(d.feePayer)===role?"Komisyon: "+(Number(fee)/1e6)+" TRX (yatırdığınız TRX tutarından kesilir).":fee>0n?"Komisyonu diğer taraf öder.":"Komisyon yok.";}showFee().catch(e=>{$("feeInfo").textContent="Takas bilgisi okunamadı: "+e.message});$("deposit").onclick=()=>run(async()=>{if(!id||![1,2].includes(role))throw Error("Davet bağlantısı eksik.");const tw=await wallet();const c=await contract();const existing=await c.getDeal(id).call();if(existing.completed||existing.cancelled)throw Error("Takas kapalı.");const deadline=Number(existing.depositDeadline.toString());if(deadline>0){const block=await tw.trx.getCurrentBlock();const chainTime=Number(block?.block_header?.raw_data?.timestamp||0)/1000;if(chainTime&&chainTime>=deadline)throw Error("15 dakikalık yatırım süresi doldu. TRX harcamadan durduruldu.");}if(Number(existing.finalDeadline.toString())>0)throw Error("Her iki yatırım tamamlanmış; yeni yatırım kabul edilmiyor.");if(role===1&&existing.depositedA||role===2&&existing.depositedB)throw Error("Bu taraf zaten yatırdı.");const type=$("asset").value;if(existing.feePayer==role&&BigInt(existing.feeAmount)>0n&&type!=="TRX")throw Error("Komisyonu ödeyen taraf TRX yatırmalıdır.");const token=type==="TRX"?ZERO:type==="FRHN"?FRHN:$("token").value.trim();if(type!=="TRX"&&!tw.isAddress(token))throw Error("Token adresi geçersiz.");let decimals=6;if(type!=="TRX")decimals=Number((await tw.contract(TOKEN_ABI,token).decimals().call()).toString());const amount=units($("amount").value.trim(),decimals);if(existing.feePayer==role&&BigInt(existing.feeAmount)>=BigInt(amount))throw Error("Sabit komisyon yatırılan miktardan küçük olmalı.");if(type!=="TRX"){const t=await tw.contract(TOKEN_ABI,token);const allowance=BigInt((await t.allowance(tw.defaultAddress.base58,address).call()).toString());if(allowance<BigInt(amount)){status("Önce token izni veriliyor. Ardından tekrar Onayla ve yatır'a basın.");await send(t.approve(address,amount));return;}}await send(c.deposit(id,role,type==="TRX"?ZERO:token,amount),{value:type==="TRX"?amount:0});status("Yatırım gönderildi. Yönetici son onayı bekleniyor.")});$("check").onclick=()=>run(async()=>{const d=await(await contract()).getDeal(id).call();$("details").textContent="A: "+(d.depositedA?"Yatırdı":"Bekliyor")+" · B: "+(d.depositedB?"Yatırdı":"Bekliyor")+" · "+(d.completed?"Takas tamamlandı":"Yönetici onayı bekleniyor");status("Durum okundu")});$("refund").onclick=()=>run(async()=>{await send((await contract()).refund(id))});</script></body></html>
