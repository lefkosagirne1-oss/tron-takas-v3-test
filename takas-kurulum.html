<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takas Nile Kurulum</title><style>:root{font:16px system-ui;color:#f1f5ff;background:#0b1425}body{max-width:560px;margin:24px auto;padding:16px}section{background:#132139;border:1px solid #344765;border-radius:16px;padding:20px}button,input{font:inherit;width:100%;padding:14px;margin:10px 0;border-radius:10px}button{background:#3b82f6;color:white;border:0;font-weight:bold}button:disabled{background:#475569}input{background:#0b1425;color:white;border:1px solid #475569}p,small{line-height:1.5}#status{overflow-wrap:anywhere;color:#fde68a}a{color:#93c5fd}</style></head><body><h1>Takas · Nile Kurulum</h1><section><p>Yalnızca <b>Nile test ağı</b>. Güvenli takas sözleşmesi bir kez kurulacak. İşlemi yönetici cüzdanı imzalar.</p><button id="connect">Yönetici cüzdanını kontrol et</button><p id="wallet"></p><label><input type="checkbox" id="ack" style="width:auto"> Nile test TRX harcayacak sözleşme kurulumunu onaylıyorum. İşlem üst sınırı 160 TRX; gerçek maliyet daha az olabilir.</label><button id="estimate">Kurulum maliyetini ücretsiz kontrol et</button><p id="cost"></p><button id="deploy" disabled>Güvenli takas sözleşmesini Nile'a kur</button><p id="status" role="status"></p><p>Önceden gönderilen işlemi kontrol et (ücretsiz):</p><input id="txid" placeholder="64 karakterlik işlem kimliği"><button id="verify">İşlemi ve sözleşmeyi kontrol et</button><div id="done" hidden><p><b>Sözleşme adresi:</b></p><input id="address" readonly><button id="copy">Adresi kopyala</button><a id="manager">Yönetici sayfasını aç</a></div></section><script>
const selectedWallet=()=>window.tronWeb?.defaultAddress?.base58||"";const $=x=>document.getElementById(x);let artifact=null,tw=null,estimated=false;const lastKey="secure-takas-deploy-pending",installedKey="secure-takas-v8-contract";function normalizeManager(raw,w){const s=String(raw);if(/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(s))return s;const h=s.replace(/^0x/i,"");if(/^[0-9a-fA-F]{64}$/.test(h))return w.address.fromHex("41"+h.slice(-40));if(/^41[0-9a-fA-F]{40}$/.test(h))return w.address.fromHex(h);if(/^[0-9a-fA-F]{40}$/.test(h))return w.address.fromHex("41"+h);throw Error("Yönetici adresi okunamadı.");}function say(x){$("status").textContent=x}async function prepare(){if(!window.tronWeb?.ready)throw Error("Sayfayı TronLink tarayıcısında aç ve cüzdanı bağla.");const w=window.tronWeb;const host=String(w.fullNode?.host||w.fullNode?.url||"").toLowerCase();if(!host.includes("nile"))throw Error("TronLink ağını Nile Testnet seç.");if(!selectedWallet())throw Error("Yönetici cüzdanını TronLink üzerinden seç.");const res=await fetch("./v6-test/dist/TakasV8Invite.json",{cache:"no-store"});if(!res.ok)throw Error("Güvenli takas derlemesi dosyası henüz yayınlanmadı.");const a=await res.json();if(a.contractName!=="TakasV8Invite"||a.compiler!=="tron-solc 0.8.31"||!Array.isArray(a.abi)||!/^[0-9a-fA-F]+$/.test(a.bytecode||""))throw Error("Resmi TRON derleyicisiyle hazırlanmış güvenli sözleşme bulunamadı. Kurulum kapalı.");tw=w;artifact=a;$("wallet").textContent="Bağlı yönetici: "+selectedWallet();const pending=localStorage.getItem(lastKey);if(pending){$("txid").value=pending;$("deploy").disabled=true;say("Önceki kurulum işlemi bulundu. Önce işlemi doğrula; yeniden kurulum yapma.")}else{$("deploy").disabled=!estimated;say("Sabit komisyonlu Güvenli takas derlemesi doğrulandı.")}}
$("connect").onclick=async()=>{try{await prepare()}catch(e){say("Hata: "+e.message)}};
$("estimate").onclick=async()=>{try{await prepare();const issuer=tw.defaultAddress.hex;const post=async(path,body)=>{const r=await fetch("https://nile.trongrid.io/wallet/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()};const [e,p,res]=await Promise.all([post("estimateenergy",{owner_address:issuer,data:artifact.bytecode}),post("getchainparameters",{}),post("getaccountresource",{address:issuer})]);if(!e.result?.result||!Number.isFinite(e.energy_required))throw Error("Energy ölçülemedi.");const price=p.chainParameter?.find(x=>x.key==="getEnergyFee")?.value;if(!price)throw Error("Energy birim fiyatı alınamadı.");const remaining=Math.max(0,(res.EnergyLimit||0)-(res.EnergyUsed||0));const cost=Math.max(0,e.energy_required-remaining)*price/1e6;$("cost").textContent="Tahmini maliyet: "+cost.toFixed(4)+" test TRX. Üst sınır 160 TRX; bu tahmin garanti değildir.";const balance=Number(await tw.trx.getBalance(selectedWallet()))/1e6;const required=cost*1.15+7;if(cost>160||required>160)throw Error("Güvenlik payıyla tahmin 160 TRX sınırını aşıyor; kurulum kapalı.");if(balance<required)throw Error("Yetersiz test TRX. Tahmini güvenli bakiye: "+required.toFixed(4)+" TRX; mevcut: "+balance.toFixed(4)+" TRX. Kurulum kapalı.");estimated=true;$("deploy").disabled=!!localStorage.getItem(lastKey);say(localStorage.getItem(lastKey)?"Önceki kurulum işlemini kontrol et.":"Ücretsiz kontrol tamamlandı. Kurulum ancak imza verirsen gerçekleşir.")}catch(e){estimated=false;$("deploy").disabled=true;say("Hata: "+e.message)}};$("deploy").onclick=async()=>{try{if(localStorage.getItem(lastKey))throw Error("Önceki kurulum işlemi doğrulanmadan yeniden kurulum yapılamaz.");if(!estimated)throw Error("Önce ücretsiz Energy kontrolünü tamamla.");if(!$("ack").checked)throw Error("Önce maliyet onay kutusunu işaretle.");await prepare();if(!estimated)throw Error("Energy kontrolünü yeniden yap.");$("deploy").disabled=true;say("TronLink imzası bekleniyor. İşlemi yalnızca kabul ediyorsan imzala.");const issuer=tw.address.toHex(selectedWallet());if(!tw.isAddress(issuer))throw Error("Yönetici adresi geçersiz.");const unsigned=await tw.transactionBuilder.createSmartContract({abi:artifact.abi,bytecode:artifact.bytecode,feeLimit:160000000,callValue:0,userFeePercentage:100,originEnergyLimit:10000000,name:"TakasV8Invite"},issuer);if(!unsigned?.txID)throw Error("Kurulum işlemi hazırlanamadı.");const signed=await tw.trx.sign(unsigned);if(!signed?.signature?.length)throw Error("TronLink imzası alınamadı.");localStorage.setItem(lastKey,unsigned.txID);$("txid").value=unsigned.txID;const broadcast=await tw.trx.sendRawTransaction(signed);if(!broadcast?.result)throw Error("Kurulum zincire gönderilemedi: "+JSON.stringify(broadcast));let info;for(let i=0;i<8;i++){info=await tw.trx.getTransactionInfo(unsigned.txID);if(info?.receipt?.result==="SUCCESS"&&info?.contract_address)break;if(info?.receipt?.result&&info.receipt.result!=="SUCCESS")throw Error("Kurulum zincirde başarısız: "+info.receipt.result);await new Promise(resolve=>setTimeout(resolve,2500));}if(info?.receipt?.result!=="SUCCESS"||!info?.contract_address)throw Error("İşlem gönderildi: "+unsigned.txID+". Sözleşme henüz doğrulanmadı; işlemi kontrol edin.");const addr=tw.address.fromHex(info.contract_address);if(!addr||!tw.isAddress(addr))throw Error("Sözleşme adresi alınamadı; işlemi kontrol et.");const onchain=await tw.contract(artifact.abi,addr);const version=Number((await onchain.inviteVersion().call()).toString());if(version!==8)throw Error("Güvenli sözleşme sürümü uyuşmuyor.");const owner=await onchain.manager().call();const normalized=normalizeManager(owner,tw);if(normalized!==selectedWallet())throw Error("Kurulan sözleşmenin yöneticisi uyuşmuyor.");$("address").value=addr;$("manager").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(addr);$("done").hidden=false;localStorage.setItem(installedKey,addr);localStorage.removeItem(lastKey);say("Takas Nile'a kuruldu ve yönetici doğrulandı.");}catch(e){say("Hata: "+(e.message||e))}finally{$("deploy").disabled=!estimated||!!localStorage.getItem(lastKey)||!$("done").hidden}};
$("verify").onclick=async()=>{try{const id=$("txid").value.trim();if(!/^[a-f0-9]{64}$/i.test(id))throw Error("64 karakterlik işlem kimliği gir.");say("Nile işlem sonucu kontrol ediliyor...");const response=await fetch("https://nile.trongrid.io/wallet/gettransactioninfobyid",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:id})});const info=await response.json();if(!info.id)throw Error("İşlem henüz bulunamadı. Biraz sonra tekrar kontrol et.");if(info.receipt?.result!=="SUCCESS"){if(info.receipt?.result){localStorage.removeItem(lastKey);estimated=false;$("deploy").disabled=true;}throw Error("İşlem başarısız: "+JSON.stringify(info.receipt||info).slice(0,350));}if(!info.contract_address)throw Error("İşlem başarılı ama sözleşme adresi bulunamadı.");const w=window.tronWeb;if(!w?.ready)throw Error("TronLink cüzdanını bağla.");const addr=w.address.fromHex(info.contract_address);const c=await w.contract(artifact?.abi||(await(await fetch("./v6-test/dist/TakasV8Invite.json")).json()).abi,addr);const version=Number((await c.inviteVersion().call()).toString());if(version!==8)throw Error("Güvenli sözleşme sürümü uyuşmuyor.");const manager=await c.manager().call();const managerAddr=normalizeManager(manager,w);if(managerAddr!==selectedWallet())throw Error("Yönetici uyuşmuyor.");$("address").value=addr;$("manager").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(addr);$("done").hidden=false;localStorage.setItem(installedKey,addr);localStorage.removeItem(lastKey);$("deploy").disabled=true;say("Güvenli takas sözleşmesi Nile üzerinde başarılı ve yönetici doğrulandı. Yeniden kurulum yapmayın.");}catch(e){say("Kontrol: "+(e.message||e))}};$("copy").onclick=()=>navigator.clipboard.writeText($("address").value).then(()=>say("Adres kopyalandı"));
</script></body></html>
