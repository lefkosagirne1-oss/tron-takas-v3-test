<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takas Nile Kurulum</title><style>:root{font:16px system-ui;color:#f1f5ff;background:#0b1425}body{max-width:560px;margin:24px auto;padding:16px}section{background:#132139;border:1px solid #344765;border-radius:16px;padding:20px}button,input{font:inherit;width:100%;padding:14px;margin:10px 0;border-radius:10px}button{background:#3b82f6;color:white;border:0;font-weight:bold}button:disabled{background:#475569}input{background:#0b1425;color:white;border:1px solid #475569}p,small{line-height:1.5}#status{overflow-wrap:anywhere;color:#fde68a}a{color:#93c5fd}</style></head><body><h1>Takas · Nile Kurulum</h1><section><p>Yalnızca <b>Nile test ağı</b>. Güvenli takas sözleşmesi bir kez kurulacak. İşlemi yönetici cüzdanı imzalar.</p><button id="connect">Yönetici cüzdanını kontrol et</button><p id="wallet"></p><label><input type="checkbox" id="ack" style="width:auto"> Nile test TRX harcayacak sözleşme kurulumunu onaylıyorum. İşlem üst sınırı 160 TRX; gerçek maliyet daha az olabilir.</label><button id="estimate">Kurulum maliyetini ücretsiz kontrol et</button><p id="cost"></p><button id="deploy" disabled>Güvenli takas sözleşmesini Nile'a kur</button><p id="status" role="status"></p><p>Önceden gönderilen işlemi kontrol et (ücretsiz):</p><input id="txid" placeholder="64 karakterlik işlem kimliği"><button id="verify">İşlemi ve sözleşmeyi kontrol et</button><div id="done" hidden><p><b>Sözleşme adresi:</b></p><input id="address" readonly><button id="copy">Adresi kopyala</button><a id="manager">Yönetici sayfasını aç</a></div></section><script>
const selectedWallet=()=>window.tronWeb?.defaultAddress?.base58||"";const $=x=>document.getElementById(x);let artifact=null,tw=null,estimated=false,estimatedWallet="",estimatedAt=0,estimatedBytecode="";const ESTIMATE_MAX_AGE_MS=5*60*1000;const estimateFresh=()=>estimated&&estimatedWallet===selectedWallet()&&estimatedAt>0&&Date.now()-estimatedAt>=0&&Date.now()-estimatedAt<ESTIMATE_MAX_AGE_MS&&estimatedBytecode!==""&&estimatedBytecode===String(artifact?.bytecode||"");const lastKey=()=>"secure-takas-deploy-pending:"+selectedWallet(),installedKey=()=>"secure-takas-v8-contract:"+selectedWallet();function normalizeManager(raw,w){const s=String(raw);if(/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(s))return s;const h=s.replace(/^0x/i,"");if(/^[0-9a-fA-F]{64}$/.test(h))return w.address.fromHex("41"+h.slice(-40));if(/^41[0-9a-fA-F]{40}$/.test(h))return w.address.fromHex(h);if(/^[0-9a-fA-F]{40}$/.test(h))return w.address.fromHex("41"+h);throw Error("Yönetici adresi okunamadı.");}function say(x){$("status").textContent=x}async function verifyDeployedRuntime(addr,a,w,expectedWallet){
 if(selectedWallet()!==expectedWallet)throw Error("Cüzdan değişti; sözleşme doğrulanmadı.");
 const expected=String(a.runtimeBytecode||"").replace(/^0x/i,"").toLowerCase();
 const refs=a.immutableReferences||{},spans=Object.values(refs).flat();
 if(!/^[0-9a-f]+$/.test(expected)||Object.keys(refs).length!==1||spans.length<2)
  throw Error("Resmi V8 çalışma kodu veya yönetici referansları eksik.");
 const managerHex=String(w.address.toHex(expectedWallet)).replace(/^0x/i,"").toLowerCase();
 if(!/^41[0-9a-f]{40}$/.test(managerHex))throw Error("Yönetici cüzdanı doğrulanamadı.");
 const response=await fetch("https://nile.trongrid.io/wallet/getcontractinfo",{
  method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({value:addr,visible:true})
 });
 if(!response.ok)throw Error("Nile sözleşme çalışma kodu okunamadı.");
 const info=await response.json();
 const actual=String(info.runtimecode||"").replace(/^0x/i,"").toLowerCase();
 if(actual.length!==expected.length||!/^[0-9a-f]+$/.test(actual))
  throw Error("Nile sözleşme çalışma kodu resmi V8 ile eşleşmiyor.");
 let maskedExpected=expected,maskedActual=actual;
 const managerSlot="0".repeat(24)+managerHex.slice(2);
 for(const span of spans){
  const start=Number(span.start),length=Number(span.length);
  if(!Number.isSafeInteger(start)||start<0||length!==32||(start+length)*2>expected.length)
   throw Error("Resmi V8 yönetici referansı geçersiz.");
  const begin=start*2,end=(start+length)*2;
  if(actual.slice(begin,end)!==managerSlot)
   throw Error("Sözleşme yönetici adresi resmi V8 koduyla uyuşmuyor.");
  const mask="0".repeat(end-begin);
  maskedExpected=maskedExpected.slice(0,begin)+mask+maskedExpected.slice(end);
  maskedActual=maskedActual.slice(0,begin)+mask+maskedActual.slice(end);
 }
 if(maskedExpected!==maskedActual)throw Error("Nile sözleşme çalışma kodu resmi V8 ile eşleşmiyor.");
 if(selectedWallet()!==expectedWallet)throw Error("Cüzdan değişti; sözleşme doğrulanmadı.");
}
async function prepare(){if(!window.tronWeb?.ready)throw Error("Sayfayı TronLink tarayıcısında aç ve cüzdanı bağla.");const w=window.tronWeb;const host=String(w.fullNode?.host||w.fullNode?.url||"").toLowerCase();if(!/^https:\/\/nile\.trongrid\.io(?::443)?\/?$/i.test(host))throw Error("TronLink ağını resmi Nile Testnet (nile.trongrid.io) seç.");if(!selectedWallet())throw Error("Yönetici cüzdanını TronLink üzerinden seç.");const prepareWallet=selectedWallet();const assertPrepareWallet=()=>{if(selectedWallet()!==prepareWallet)throw Error("Cüzdan değişti; kurulum kontrolü iptal edildi.");};$("done").hidden=true;$("address").value="";$("manager").href="";const res=await fetch("./v6-test/dist/TakasV8Invite.json",{cache:"no-store"});if(!res.ok)throw Error("Güvenli takas derlemesi dosyası henüz yayınlanmadı.");const a=await res.json();assertPrepareWallet();if(a.contractName!=="TakasV8Invite"||a.compiler!=="tron-solc 0.8.31"||!Array.isArray(a.abi)||!a.abi.some(x=>x.name==="commitRole")||!a.abi.some(x=>x.name==="committedHash")||!/^[0-9a-fA-F]+$/.test(a.bytecode||""))throw Error("Resmi TRON derleyicisiyle hazırlanmış güvenli sözleşme bulunamadı. Kurulum kapalı.");tw=w;artifact=a;$("wallet").textContent="Bağlı yönetici: "+prepareWallet;const installed=localStorage.getItem("secure-takas-v8-contract:"+prepareWallet);if(installed){if(!w.isAddress(installed))throw Error("Kayıtlı V8 sözleşme adresi geçersiz; kurulum kapalı.");const existing=await w.contract(a.abi,installed);assertPrepareWallet();const version=Number((await existing.inviteVersion().call()).toString());assertPrepareWallet();const manager=normalizeManager(await existing.manager().call(),w);assertPrepareWallet();if(version!==8||manager!==prepareWallet)throw Error("Kayıtlı sözleşme bu yönetici cüzdanıyla eşleşmiyor; yeniden kurulum yapmayın.");await verifyDeployedRuntime(installed,a,w,prepareWallet);assertPrepareWallet();$("address").value=installed;$("manager").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(installed);$("done").hidden=false;$("deploy").disabled=true;estimated=false;say("V8 sözleşmesi zaten kurulu ve yönetici doğrulandı. Yeniden kurulum gerekmez.");return;}assertPrepareWallet();const pending=localStorage.getItem("secure-takas-deploy-pending:"+prepareWallet);if(pending){$("txid").value=pending;$("deploy").disabled=true;say("Önceki kurulum işlemi bulundu. Önce işlemi doğrula; yeniden kurulum yapma.")}else{$("deploy").disabled=!estimateFresh();say("Sabit komisyonlu Güvenli takas derlemesi doğrulandı.")}}
$("connect").onclick=async()=>{try{await prepare()}catch(e){say("Hata: "+e.message)}};
$("estimate").onclick=async()=>{try{await prepare();if(localStorage.getItem(installedKey()))throw Error("V8 sözleşmesi zaten kurulu; yeniden kurulum için Energy tahmini yapılmaz.");const estimateWallet=selectedWallet(),estimateBytecode=String(artifact.bytecode);const assertEstimateWallet=()=>{if(selectedWallet()!==estimateWallet)throw Error("Cüzdan değişti; Energy tahmini iptal edildi. Yeni cüzdan için tekrar kontrol edin.");if(String(artifact?.bytecode||"")!==estimateBytecode)throw Error("Resmi derleme değişti; Energy tahmini iptal edildi. Yeniden kontrol edin.");};const issuer=tw.address.toHex(estimateWallet);const post=async(path,body)=>{const r=await fetch("https://nile.trongrid.io/wallet/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error(path+" HTTP "+r.status);return r.json()};const [p,res]=await Promise.all([post("getchainparameters",{}),post("getaccountresource",{address:issuer})]);assertEstimateWallet();let estimatedEnergy=0;/* Official TronWeb read-only deployment simulation (not a broadcast). */if(typeof tw.transactionBuilder?.deployConstantContract==="function"){try{const e=await tw.transactionBuilder.deployConstantContract({ownerAddress:selectedWallet(),input:"0x"+estimateBytecode,callValue:0,confirmed:false});if(e?.result?.result===true&&Number.isFinite(e.energy_required)&&e.energy_required>0)estimatedEnergy=e.energy_required;}catch(_){/* Older TronLink: try Nile HTTP read-only simulation below. */}}if(!estimatedEnergy){const e=await post("estimateenergy",{owner_address:issuer,data:estimateBytecode}).catch(()=>({}));if(e.result?.result&&Number.isFinite(e.energy_required)&&e.energy_required>0)estimatedEnergy=e.energy_required;}if(!estimatedEnergy){const fallback=await post("triggerconstantcontract",{owner_address:issuer,data:estimateBytecode}).catch(()=>({}));if(fallback.result?.result&&Number.isFinite(fallback.energy_used)&&fallback.energy_used>0)estimatedEnergy=fallback.energy_used;}assertEstimateWallet();if(!estimatedEnergy)throw Error("Kurulum için geçerli pozitif Energy tahmini alınamadı; imza kapalı.");const price=p.chainParameter?.find(x=>x.key==="getEnergyFee")?.value;if(!price)throw Error("Energy birim fiyatı alınamadı.");const remaining=Math.max(0,(res.EnergyLimit||0)-(res.EnergyUsed||0));const cost=Math.max(0,estimatedEnergy-remaining)*price/1e6;$("cost").textContent="Tahmini maliyet: "+cost.toFixed(4)+" test TRX. Üst sınır 160 TRX; bu tahmin garanti değildir.";const balance=Number(await tw.trx.getBalance(estimateWallet))/1e6;assertEstimateWallet();const required=cost*1.15+7;if(cost>160||required>160)throw Error("Güvenlik payıyla tahmin 160 TRX sınırını aşıyor; kurulum kapalı.");if(balance<required)throw Error("Yetersiz test TRX. Tahmini güvenli bakiye: "+required.toFixed(4)+" TRX; mevcut: "+balance.toFixed(4)+" TRX. Kurulum kapalı.");assertEstimateWallet();estimated=true;estimatedWallet=estimateWallet;estimatedAt=Date.now();estimatedBytecode=estimateBytecode;$("deploy").disabled=!!localStorage.getItem(lastKey());say(localStorage.getItem(lastKey())?"Önceki kurulum işlemini kontrol et.":"Ücretsiz kontrol tamamlandı. Kurulum ancak imza verirsen gerçekleşir.")}catch(e){estimated=false;estimatedWallet="";estimatedAt=0;estimatedBytecode="";$("deploy").disabled=true;say("Hata: "+e.message)}};$("deploy").onclick=async()=>{try{if(localStorage.getItem(installedKey()))throw Error("V8 sözleşmesi zaten kurulu. Yönetici panelini açın; ikinci kez kurulum yapmayın.");if(localStorage.getItem(lastKey()))throw Error("Önceki kurulum işlemi doğrulanmadan yeniden kurulum yapılamaz.");if(!estimateFresh())throw Error("Kurulum Energy tahmini eski veya cüzdan değişti. Ücretsiz maliyet kontrolünü yeniden yap.");const deploymentWallet=selectedWallet(),deploymentPendingKey="secure-takas-deploy-pending:"+deploymentWallet;if(!$("ack").checked)throw Error("Önce maliyet onay kutusunu işaretle.");await prepare();if(!estimateFresh()||selectedWallet()!==deploymentWallet)throw Error("Cüzdan değişti veya Energy tahmini eskidi. Ücretsiz maliyet kontrolünü yeniden yap.");$("deploy").disabled=true;say("TronLink imzası bekleniyor. İşlemi yalnızca kabul ediyorsan imzala.");const issuer=tw.address.toHex(deploymentWallet);if(!tw.isAddress(issuer))throw Error("Yönetici adresi geçersiz.");const unsigned=await tw.transactionBuilder.createSmartContract({abi:artifact.abi,bytecode:artifact.bytecode,feeLimit:160000000,callValue:0,userFeePercentage:100,originEnergyLimit:10000000,name:"TakasV8Invite"},issuer);if(!unsigned?.txID)throw Error("Kurulum işlemi hazırlanamadı.");if(selectedWallet()!==deploymentWallet)throw Error("Cüzdan değişti. Kurulum imzalanmadı.");if(!estimateFresh())throw Error("Energy tahmini eskidi. Kurulum imzalanmadı; yeniden ücretsiz kontrol et.");const signed=await tw.trx.sign(unsigned);if(!signed?.signature?.length)throw Error("TronLink imzası alınamadı.");if(selectedWallet()!==deploymentWallet)throw Error("Cüzdan değişti. Kurulum yayınlanmadı.");if(!estimateFresh())throw Error("Energy tahmini eskidi. Kurulum yayınlanmadı; önce işlemi kontrol et.");localStorage.setItem(deploymentPendingKey,unsigned.txID);$("txid").value=unsigned.txID;const broadcast=await tw.trx.sendRawTransaction(signed);if(!broadcast?.result){const code=String(broadcast?.code||"");const definitelyRejected=["SIGERROR","CONTRACT_VALIDATE_ERROR","TAPOS_ERROR","TRANSACTION_EXPIRATION_ERROR","BANDWIDTH_ERROR"].includes(code);if(definitelyRejected){/* Explicit validation rejection: safe to clear pending, but require a new estimate. */localStorage.removeItem(deploymentPendingKey);estimated=false;estimatedWallet="";estimatedAt=0;$("txid").value="";throw Error("Nile kurulum işlemini reddetti. Yayın yapılmadı; Energy kontrolünü yeniden yapın. Ayrıntı: "+JSON.stringify(broadcast));}/* Duplicate or unknown node response may mean the transaction was accepted elsewhere. */throw Error("Kurulum yayın sonucu belirsiz ("+code+"). İşlem kimliği saklandı; tekrar kurmadan önce işlemi doğrulayın: "+unsigned.txID);}let info;for(let i=0;i<8;i++){info=await tw.trx.getTransactionInfo(unsigned.txID);if(info?.receipt?.result==="SUCCESS"&&info?.contract_address)break;if(info?.receipt?.result&&info.receipt.result!=="SUCCESS")throw Error("Kurulum zincirde başarısız: "+info.receipt.result);await new Promise(resolve=>setTimeout(resolve,2500));}if(info?.receipt?.result!=="SUCCESS"||!info?.contract_address)throw Error("İşlem gönderildi: "+unsigned.txID+". Sözleşme henüz doğrulanmadı; işlemi kontrol edin.");const addr=tw.address.fromHex(info.contract_address);if(!addr||!tw.isAddress(addr))throw Error("Sözleşme adresi alınamadı; işlemi kontrol et.");const onchain=await tw.contract(artifact.abi,addr);const version=Number((await onchain.inviteVersion().call()).toString());if(version!==8)throw Error("Güvenli sözleşme sürümü uyuşmuyor.");const owner=await onchain.manager().call();const normalized=normalizeManager(owner,tw);if(normalized!==selectedWallet())throw Error("Kurulan sözleşmenin yöneticisi uyuşmuyor.");await verifyDeployedRuntime(addr,artifact,tw,deploymentWallet);$("address").value=addr;$("manager").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(addr);$("done").hidden=false;localStorage.setItem(installedKey(),addr);localStorage.removeItem(deploymentPendingKey);say("Takas Nile'a kuruldu ve yönetici doğrulandı.");}catch(e){say("Hata: "+(e.message||e))}finally{$("deploy").disabled=!estimateFresh()||!!localStorage.getItem(lastKey())||!$("done").hidden}};
$("verify").onclick=async()=>{try{const id=$("txid").value.trim();if(!/^[a-f0-9]{64}$/i.test(id))throw Error("64 karakterlik işlem kimliği gir.");const verifyWallet=selectedWallet(),pendingKey="secure-takas-deploy-pending:"+verifyWallet;if(!verifyWallet)throw Error("Önce TronLink cüzdanını seçin.");const pendingTx=localStorage.getItem(pendingKey);if(pendingTx&&pendingTx.toLowerCase()!==id.toLowerCase())throw Error("Önce bekleyen kurulumun işlem kimliğini doğrulayın. Farklı işlem kimliğiyle bekleyen kurulum kaydı silinemez.");say("Nile işlem sonucu kontrol ediliyor...");const response=await fetch("https://nile.trongrid.io/wallet/gettransactioninfobyid",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:id})});const info=await response.json();if(selectedWallet()!==verifyWallet)throw Error("Cüzdan değişti; bekleyen kurulum kaydı korunuyor. Yeniden doğrulayın.");if(!info.id)throw Error("İşlem henüz bulunamadı. Biraz sonra tekrar kontrol et.");if(info.receipt?.result!=="SUCCESS"){if(info.receipt?.result){localStorage.removeItem(pendingKey);estimated=false;$("deploy").disabled=true;}throw Error("İşlem başarısız: "+JSON.stringify(info.receipt||info).slice(0,350));}if(!info.contract_address)throw Error("İşlem başarılı ama sözleşme adresi bulunamadı.");const w=window.tronWeb;if(!w?.ready)throw Error("TronLink cüzdanını bağla.");const node=String(w.fullNode?.host||w.fullNode?.url||"").toLowerCase();if(!/^https:\/\/nile\.trongrid\.io(?::443)?\/?$/i.test(node))throw Error("Doğrulama için TronLink ağını resmi Nile Testnet seç. Başka ağda sözleşme doğrulanmaz.");const txRes=await fetch("https://nile.trongrid.io/wallet/gettransactionbyid",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:id})});if(!txRes.ok)throw Error("Kurulum işlemi ayrıntısı okunamadı.");const tx=await txRes.json();if(selectedWallet()!==verifyWallet)throw Error("Cüzdan değişti; bekleyen kurulum kaydı korunuyor. Yeniden doğrulayın.");const deployment=tx?.raw_data?.contract?.[0];const deployedCode=String(deployment?.parameter?.value?.new_contract?.bytecode||"").replace(/^0x/i,"").toLowerCase();const expectedCode=String((artifact||(await(await fetch("./v6-test/dist/TakasV8Invite.json")).json())).bytecode||"").replace(/^0x/i,"").toLowerCase();const deployedOwner=String(deployment?.parameter?.value?.owner_address||"").replace(/^0x/i,"").toLowerCase();if(deployment?.type!=="CreateSmartContract"||!expectedCode||deployedCode!==expectedCode||deployedOwner!==String(w.address.toHex(verifyWallet)).replace(/^0x/i,"").toLowerCase())throw Error("Bu işlem resmi V8 derlemesine ve seçili yöneticiye ait değil; sözleşme kaydedilmedi.");const addr=w.address.fromHex(info.contract_address);const c=await w.contract(artifact?.abi||(await(await fetch("./v6-test/dist/TakasV8Invite.json")).json()).abi,addr);const version=Number((await c.inviteVersion().call()).toString());if(version!==8)throw Error("Güvenli sözleşme sürümü uyuşmuyor.");const manager=await c.manager().call();const managerAddr=normalizeManager(manager,w);if(managerAddr!==verifyWallet)throw Error("Yönetici uyuşmuyor.");await verifyDeployedRuntime(addr,artifact||(await(await fetch("./v6-test/dist/TakasV8Invite.json")).json()),w,verifyWallet);$("address").value=addr;$("manager").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(addr);$("done").hidden=false;if(selectedWallet()!==verifyWallet)throw Error("Cüzdan değişti; bekleyen kurulum kaydı korunuyor. Yeniden doğrulayın.");localStorage.setItem("secure-takas-v8-contract:"+verifyWallet,addr);localStorage.removeItem(pendingKey);$("deploy").disabled=true;say("Güvenli takas sözleşmesi Nile üzerinde başarılı ve yönetici doğrulandı. Yeniden kurulum yapmayın.");}catch(e){say("Kontrol: "+(e.message||e))}};$("copy").onclick=()=>navigator.clipboard.writeText($("address").value).then(()=>say("Adres kopyalandı"));
</script></body></html>
