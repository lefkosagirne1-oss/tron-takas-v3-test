<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 Nile · Dağıtım ön kontrolü</title><style>body{font:16px/1.5 system-ui;max-width:650px;margin:auto;padding:20px;background:#0b1627;color:#eff5ff}section{padding:18px;border:1px solid #526680;border-radius:14px;margin:16px 0}button{padding:14px;border:0;border-radius:10px;background:#477be3;color:white;font:inherit;width:100%;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a7ccff}.warn{color:#ffd7a3}</style></head><body><h1>V5 · Nile dağıtım ön kontrolü</h1><p class="warn">Bu sayfa yalnızca ücretsiz ön kontrol yapar. İmzalama, dağıtım ve TRX harcama özelliği yoktur. V4 değişmez.</p><section><button id="connect">TronLink bağla</button><button id="check">Derlenmiş V5 dosyasını ve dağıtım taslağını kontrol et</button><pre id="out">Hazır. Önce TronLink bağla.</pre></section><p><a href="./v5-nile-yonetici.html">V5 yönetici paneli</a></p><script>
let tw;const out=document.getElementById("out");const say=x=>out.textContent=x;
document.getElementById("connect").onclick=async()=>{try{const p=window.tronLink||window.tron;if(p?.request)await p.request({method:"tron_requestAccounts"});tw=window.tronWeb||p?.tronWeb;if(!tw?.ready||!tw.defaultAddress?.base58)throw Error("TronLink bağlı değil");const host=String(tw.fullNode?.host||tw.fullNode?.url||"").toLowerCase();if(!host.includes("nile"))throw Error("TronLink Nile ağında olmalı");say("Nile cüzdanı: "+tw.defaultAddress.base58+"\nİmza atılmadı.");}catch(e){say("Hata: "+e.message)}};
document.getElementById("check").onclick=async()=>{try{if(!tw?.ready)throw Error("Önce Nile cüzdanını bağla");say("Derlenmiş dosya okunuyor...");const response=await fetch("./v5-deploy/TakasV5FixedFee.json",{cache:"no-store"});if(!response.ok)throw Error("Dağıtım dosyası yayımlanmamış (HTTP "+response.status+")");const data=await response.json();if(data.contractName!=="TakasV5FixedFee"||!Array.isArray(data.abi)||!/^0x[0-9a-f]+$/i.test(data.bytecode))throw Error("Sözleşme dosyası geçersiz");const version=data.abi.find(x=>x.type==="function"&&x.name==="VERSION");const create=data.abi.find(x=>x.type==="function"&&x.name==="createInvite");if(!version||!create||create.inputs?.length!==3)throw Error("V5 ABI doğrulanamadı");const bytes=(data.bytecode.length-2)/2;const chain=await tw.trx.getChainParameters();const energy=chain.find(x=>x.key==="getEnergyFee");const price=energy?.value;let tx;try{tx=await tw.transactionBuilder.createSmartContract({name:"TakasV5FixedFee",abi:data.abi,bytecode:data.bytecode.slice(2),feeLimit:300000000,userFeePercentage:100,originEnergyLimit:10000000,callValue:0},tw.defaultAddress.base58)}catch(e){throw Error("Ücretsiz işlem taslağı oluşturulamadı: "+e.message)}if(!tx?.raw_data?.contract?.length)throw Error("İşlem taslağı alınamadı");say("V5 dosyası: OK\nBytecode: "+bytes+" bayt\nAğ: Nile\nCüzdan: "+tw.defaultAddress.base58+"\nEnergy birim bedeli: "+(price??"okunamadı")+" SUN\nÜcretsiz imzasız dağıtım taslağı: OK\nTaslak feeLimit: 300 TRX (GERÇEK MALİYET TAHMİNİ DEĞİLDİR)\n\nÖNEMLİ: Dağıtım maliyeti henüz hesaplanmadı. Hiçbir işlem imzalanmadı veya gönderilmedi.");}catch(e){say("Ön kontrol hatası: "+e.message)}};
</script></body></html>
