<!doctype html><html lang="tr"><head><title>V6 · Yönetici</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font:16px system-ui;color:#edf4ff;background:#0b1425}body{max-width:560px;margin:30px auto;padding:16px}main{display:grid;gap:14px}section{padding:18px;border:1px solid #31435f;border-radius:16px;background:#132139}h1{font-size:1.6rem}h2{font-size:1.1rem}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #61718b}input,select{background:#0b1425;color:white}button{margin-top:12px;background:#3b82f6;color:white;font-weight:700;border:0}button:disabled{background:#475569}small{color:#cbd5e1;overflow-wrap:anywhere}#status{overflow-wrap:anywhere;color:#facc15}a{color:#93c5fd}</style></head><body><main><h1>Yönetici · Sade Takas V6</h1><section><strong>Sabit miktarlı komisyon</strong><p>Yeni sözleşme kurulana kadar işlem oluşturulamaz. Eski yüzde komisyonlu sözleşme kullanılmaz.</p></section><section><h2>Yeni takas</h2><label>Komisyonu kim öder?</label><select id="payer"><option value="0">Komisyon yok</option><option value="1">A</option><option value="2">B</option></select><label>Komisyon miktarı</label><input id="fee" inputmode="decimal" value="0" placeholder="Örn. 5"><label>Komisyon varlığı</label><select id="feeAsset"><option value="TRX">TRX</option></select><small>Şimdilik sabit komisyon TRX olarak alınır. Komisyonu ödeyen taraf TRX yatırmalıdır.</small><button id="create">Takas bağlantılarını oluştur</button></section><section><h2>Bağlantılar</h2><label>A</label><input id="a" readonly><button id="copyA">A bağlantısını kopyala</button><label>B</label><input id="b" readonly><button id="copyB">B bağlantısını kopyala</button></section><section><h2>Son onay</h2><label>Takas numarası</label><input id="id" inputmode="numeric"><button id="check">Yatırımları kontrol et</button><p id="details">Henüz takas seçilmedi.</p><button id="final">İki tarafı kontrol ettim, takası tamamla</button></section><p id="status" role="status"></p></main><script src="v6-common.js"></script><script>async function run(fn){try{await fn()}catch(e){status("Hata: "+(e.message||e))}}$("create").onclick=()=>run(async()=>{if(!fixedReady())throw Error("Yeni sabit komisyon sözleşmesi gerekli.");const c=await contract();const tw=await wallet();const owner=await c.manager().call();const ownerAddr=tw.address.fromHex(String(owner).startsWith("41")?String(owner):tw.address.toHex(String(owner)));if(ownerAddr!==tw.defaultAddress.base58)throw Error("Bu cüzdan yönetici değil.");const payer=Number($("payer").value);const fee=units($("fee").value.trim(),6);if(payer===0&&fee!=="0")throw Error("Komisyon yok seçildiğinde 0 gir.");const next=Number((await c.nextId().call()).toString());const tx=await send(c.create(payer,fee));let info;for(let i=0;i<12;i++){info=await tw.trx.getTransactionInfo(tx);if(info?.receipt?.result)break;await new Promise(resolve=>setTimeout(resolve,2000))}if(info?.receipt?.result!=="SUCCESS")throw Error("Takas oluşturma henüz doğrulanmadı. İşlem kimliği: "+tx);const created=await c.getDeal(next).call();if(Number(created.feePayer)!==payer||BigInt(created.feeAmount.toString())!==BigInt(fee))throw Error("Zincirdeki komisyon uyuşmuyor; bağlantılar oluşturulmadı.");status("Takas zincirde doğrulandı.");$("id").value=next;$("a").value=link(1,next);$("b").value=link(2,next)});$("copyA").onclick=()=>copy($("a").value);$("copyB").onclick=()=>copy($("b").value);$("check").onclick=()=>run(async()=>{const d=await (await contract()).getDeal($("id").value).call();$("details").textContent="A: "+(d.depositedA?"Yatırdı":"Bekleniyor")+" · "+(d.partyA||"")+" · "+(d.amountA||"0")+" | B: "+(d.depositedB?"Yatırdı":"Bekleniyor")+" · "+(d.partyB||"")+" · "+(d.amountB||"0");status("Zincir bilgileri okundu.")});$("final").onclick=()=>run(async()=>{if(!fixedReady())throw Error("Yeni sabit komisyon sözleşmesi gerekli.");const c=await contract();const tw=await wallet();const owner=await c.manager().call();const ownerAddr=tw.address.fromHex(String(owner).startsWith("41")?String(owner):tw.address.toHex(String(owner)));if(ownerAddr!==tw.defaultAddress.base58)throw Error("Bu cüzdan yönetici değil.");const d=await c.getDeal($("id").value).call();if(!d.depositedA||!d.depositedB)throw Error("Her iki taraf da yatırmalı.");if(!confirm("İki yatırımı ve miktarları kontrol ettiniz mi?"))return;await send(c.finalize($("id").value))});</script></body></html>
