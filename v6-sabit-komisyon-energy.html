<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 Ücretsiz Energy Kontrolü</title><style>body{font:17px system-ui;background:#101a30;color:white;max-width:540px;margin:40px auto;padding:20px}button{padding:16px;background:#407af3;color:white;border:0;border-radius:12px;font:inherit;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2c46;padding:16px;border-radius:12px}</style><h2>V6 · SABİT KOMİSYON · YENİ KONTROL</h2><p>Sabit komisyonlu yeni sözleşmenin Energy ölçümü. İmza ve TRX harcaması yok.</p><button id="run">Nile Energy maliyetini sorgula</button><pre id="out">Hazır</pre><script>document.getElementById("run").onclick=async()=>{const out=document.getElementById("out");out.textContent="Sorgulanıyor...";try{const a=await(await fetch("./v6-test/dist/TakasV6Fixed.json",{cache:"no-store"})).json();if(a.contractName!=="TakasV7Fixed")throw Error("Yanlış derleme dosyası.");const tw=window.tronWeb;const issuer=tw?.defaultAddress?.hex;if(!issuer)throw Error("TronLink tarayıcısında açın; yalnızca adres dönüştürme kullanılıyor.");const post=async(path,body)=>{const r=await fetch("https://nile.trongrid.io/wallet/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()};const [estimate,params,resources]=await Promise.all([post("estimateenergy",{owner_address:issuer,data:a.bytecode}),post("getchainparameters",{}),post("getaccountresource",{address:issuer})]);const fee=params.chainParameter?.find(x=>x.key==="getEnergyFee")?.value;const energy=estimate.energy_required;const remaining=Math.max(0,(resources.EnergyLimit||0)-(resources.EnergyUsed||0));out.textContent=JSON.stringify({estimate,energyPriceSun:fee,availableEnergy:remaining,estimatedTRX:energy&&fee?Math.max(0,energy-remaining)*fee/1e6:null,notice:"Bu hesap tahmindir; kurulum yapılmadı."},null,2)}catch(e){out.textContent="Sorgu başarısız: "+e.message+"; işlem yapılmadı."}};</script></html>
