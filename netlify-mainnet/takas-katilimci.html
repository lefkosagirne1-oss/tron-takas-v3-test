<!doctype html><html lang="tr"><head><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1425"><link rel="icon" href="icon.svg"><title>Takas · Katılımcı</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}button,input,select{min-height:46px}.network{color:#fbbf24;font-weight:700}.connection{margin-bottom:12px}:root{font:16px system-ui;color:#edf4ff;background:#0b1425}body{max-width:560px;margin:30px auto;padding:16px}main{display:grid;gap:14px}section{padding:18px;border:1px solid #31435f;border-radius:16px;background:#132139}h1{font-size:1.6rem}h2{font-size:1.1rem}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #61718b}input,select{background:#0b1425;color:white}button{margin-top:12px;background:#3b82f6;color:white;font-weight:700;border:0}button:disabled{background:#475569}small{color:#cbd5e1;overflow-wrap:anywhere}#status{overflow-wrap:anywhere;color:#facc15}a{color:#93c5fd}
button{cursor:pointer}button:disabled{cursor:wait}#details{line-height:1.6}#preview{font-weight:600;color:#93c5fd}</style></head><body><main>
<h1>Takas daveti</h1><p class="network">TRON Mainnet · Gerçek varlıklar</p><button class="connection" id="connect">Cüzdanı bağla</button><small id="connected"></small>
<section><h2 id="roleLabel">Katılımcı</h2><p id="feeInfo">Takas bilgisi okunuyor...</p>
<label>Göndereceğiniz varlık</label><select id="asset"><option value="TRX">TRX</option><option value="USDT">USDT</option><option value="OTHER">Diğer TRC20 (özel token)</option></select>
<div id="tokenWrap" hidden><label>Token sözleşme adresi (Mainnet)</label><input id="token" placeholder="T ile başlayan token adresi"></div>
<label>Göndereceğiniz miktar</label><input id="amount" inputmode="decimal" placeholder="Örn. 100">
<p id="preview">Miktarı girin.</p>
<button id="deposit">Onayla ve yatır</button>
<small>Bu bağlantı size özeldir. İlk yatırımda cüzdan davetini kilitleme ve yatırma ayrı imzalanır; TRC20 için token izni de gerekebilir.</small></section>
<section><h2>Takas durumu</h2><button id="check">Durumu görüntüle</button><p id="details">Henüz kontrol edilmedi.</p>
<button id="refund">Süre dolduysa yatırımı geri al</button></section>
<p id="status" role="status"></p></main><script src="takas-common.js?v=mainnet-hazir-prep1"></script><script>
const role=Number(qs.get("role")),id=qs.get("id"),secret=new URLSearchParams(location.hash.slice(1)).get("secret");
let deal=null,busy=false;
$("roleLabel").textContent=role===1?"A tarafı":role===2?"B tarafı":"Geçersiz davet";
async function run(button,fn){
 if(busy)return;busy=true;button.disabled=true;
 try{operationAccount=getWallet()?.defaultAddress?.base58||"";status("Bilgiler zincirden kontrol ediliyor...");await fn();}catch(e){status("Hata: "+(e.message||e));}
 finally{operationAccount="";busy=false;button.disabled=false;}
}
function validInvite(){if(!fixedReady()||!/^[1-9]\d*$/.test(id||"")||![1,2].includes(role)||!validSecret(secret))throw Error("Geçerli takas daveti gerekli.");}
function updatePreview(){
 const type=$("asset").value;
 if(!deal){$("preview").textContent="Takas bilgisi okununca net tutar gösterilecek.";return;}
 if(type!=="TRX"){
  $("preview").textContent=Number(deal.feePayer)===role&&BigInt(deal.feeAmount)>0n?"Token miktarı tam gönderilir; ek "+displayUnits(deal.feeAmount)+" TRX yalnız başarı komisyonu olarak tutulur. İadede geri döner.":"Bu tarafta token komisyonu yok. Miktarı kontrol edin.";
  return;
 }
 $("preview").textContent=netPreview($("amount").value.trim(),deal.feeAmount.toString(),deal.feePayer,role,"TRX");
}
$("asset").onchange=()=>{$("tokenWrap").hidden=$("asset").value!=="OTHER";updatePreview();};
$("amount").oninput=updatePreview;
async function readDeal(){
 validInvite();
 const c=await contract();
 deal=await c.getDeal(id).call();
 const expected=role===1?deal.inviteHashA:deal.inviteHashB;
 if(!sameHash(expected,await hashSecret(secret)))throw Error("Bu tarafın davet anahtarı yanlış. Yönetici tarafından gönderilen tam bağlantıyı kullanın.");
 const fee=BigInt(deal.feeAmount.toString()),payer=Number(deal.feePayer);
 $("feeInfo").textContent=fee>0n&&payer===role?"Sabit başarı komisyonu: "+displayUnits(fee)+" TRX. TRX yatırımından kesilir; token yatırımında ayrıca yatırılır.":fee>0n?"Komisyonu diğer taraf öder ("+displayUnits(fee)+" TRX).":"Komisyon yok.";
 updatePreview();
 return {c,d:deal};
}
async function check(){
 const {d}=await readDeal();
 const a=d.depositedA?"Yatırdı":"Bekliyor",b=d.depositedB?"Yatırdı":"Bekliyor";
 const state=d.completed?"Takas tamamlandı":d.cancelled?"Takas iptal":d.refundedA||d.refundedB?"İade süreci":d.depositedA&&d.depositedB?"Yönetici son onayı bekleniyor":"Yatırımlar bekleniyor";
 $("details").textContent="A: "+a+" · B: "+b+" · "+state;
}
$("connect").onclick=()=>run($("connect"),async()=>{const tw=await connectWallet();$("connected").textContent=tw.defaultAddress.base58;await check();status("Cüzdan ve davet doğrulandı.");});
$("check").onclick=()=>run($("check"),async()=>{await check();status("Güncel durum zincirden okundu.");});
$("deposit").onclick=()=>run($("deposit"),async()=>{
 const tw=await wallet(),{c,d}=await readDeal();
 if(d.completed||d.cancelled||d.refundedA||d.refundedB)throw Error("Bu takas kapalı.");
 const deadline=Number(d.depositDeadline.toString());
 if(deadline){
  const now=await chainTime(tw);
  if(now>=deadline)throw Error("15 dakikalık yatırım süresi doldu. İşlem gönderilmedi.");
 }
 if(Number(d.finalDeadline.toString())>0)throw Error("İki taraf da yatırmış; yeni yatırım yapılamaz.");
 if(role===1&&d.depositedA||role===2&&d.depositedB)throw Error("Bu taraf zaten yatırım yaptı.");
 const other=role===1?d.partyB:d.partyA;
 if(readableAddress(other,tw)===tw.defaultAddress.base58)throw Error("A ve B farklı cüzdanlar olmalıdır.");
 if(readableAddress(await c.manager().call(),tw)===tw.defaultAddress.base58)throw Error("Yönetici katılımcı olarak yatıramaz. Katılımcı cüzdanını seçin.");
 const type=$("asset").value;

 const token=type==="TRX"?ZERO:type==="USDT"?USDT:$("token").value.trim();
 if(type!=="TRX"&&!tw.isAddress(token))throw Error("Mainnet token sözleşme adresi geçersiz.");
 let decimals=6;
 if(type!=="TRX"){
  decimals=Number((await(await tw.contract(TOKEN_ABI,token)).decimals().call()).toString());
 }
 const amount=units($("amount").value.trim(),decimals);
 if(BigInt(amount)===0n)throw Error("Miktar sıfırdan büyük olmalı.");
 if(type==="TRX"&&Number(d.feePayer)===role&&BigInt(d.feeAmount)>=BigInt(amount))throw Error("Komisyon "+displayUnits(d.feeAmount)+" TRX. Yatırım bunun üzerinde olmalı.");
 if(type!=="TRX"){
  const t=await tw.contract(TOKEN_ABI,token);
  const allowance=BigInt((await t.allowance(tw.defaultAddress.base58,address).call()).toString());
  if(allowance<BigInt(amount)){
   status("Token izni için TronLink imzası bekleniyor...");
   if(allowance>0n)await send(t.approve(address,"0"));
   await send(t.approve(address,amount));
  }
 }
 await ensureCommit(c,id,role,secret,tw);
 const extra=Number(d.feePayer)===role?d.feeAmount.toString():"0";
 await send(c.deposit(id,role,token,amount,secret),{value:type==="TRX"?amount:extra});
 await check();
 status("Yatırım zincirde doğrulandı. Diğer taraf ve yönetici bekleniyor.");
});
$("refund").onclick=()=>run($("refund"),async()=>{
 const tw=await wallet(),{c,d}=await readDeal();
 if(d.completed)throw Error("Takas tamamlanmış, iade yapılamaz.");
 const mine=role===1?d.partyA:d.partyB,refunded=role===1?d.refundedA:d.refundedB;
 if(readableAddress(mine,tw)!==tw.defaultAddress.base58)throw Error("Bu cüzdan ilgili tarafın yatırımcısı değil.");
 if(refunded)throw Error("Yatırım zaten iade edilmiş.");
 const deadline=Number((d.finalDeadline&&Number(d.finalDeadline.toString())>0?d.finalDeadline:d.depositDeadline).toString());
 if(!deadline)throw Error("Henüz yatırım yapılmamış.");
 const now=await chainTime(tw);
 if(now<deadline)throw Error("İade süresi henüz gelmedi.");
 await send(c.refund(id));await check();status("İade işlemi zincirde doğrulandı.");
});
if(fixedReady()&&/^[1-9]\d*$/.test(id||"")&&[1,2].includes(role)&&validSecret(secret)){
 readDeal().catch(e=>{$("feeInfo").textContent="Takas bilgisi okunamadı: "+e.message;});
}else{$("feeInfo").textContent="Geçerli davet bağlantısı gerekli.";}
</script></body></html>
