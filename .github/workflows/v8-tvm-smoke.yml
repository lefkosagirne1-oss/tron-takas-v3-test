name: V8 Nile TVM local smoke
on:
  push:
    paths:
      - 'contracts/TakasV8Invite.sol'
      - 'v6-test/dist/TakasV8Invite.json'
      - 'v8-test/tvm-smoke.mjs'
      - 'v8-test/tvm-state.mjs'
      - 'v8-test/optimizer-benchmark.mjs'
      - '.github/workflows/v8-tvm-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nile-tvm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install pinned local TRON VM simulator
        run: npm install --no-save --package-lock=false --no-audit --no-fund @tvmjs/tvm@1.1.0 @tvmjs/util@1.1.0 @tvmjs/common@1.1.0 @tvmjs/block@1.0.1
      - name: Run official tron-solc V8 runtime in local Nile TVM
        run: |
          node v8-test/tvm-smoke.mjs
          node v8-test/tvm-state.mjs
      - name: Download pinned official TRON Solidity compiler for cost benchmark
        run: |
          mkdir -p v6-test/.cache
          curl --fail --location --retry 3 --silent --show-error --output v6-test/.cache/tron-soljson.cjs 'https://raw.githubusercontent.com/tronprotocol/solc-bin/main/wasm/soljson-v0.8.31+commit.c2812a3d.js'
          test "$(git hash-object v6-test/.cache/tron-soljson.cjs)" = "a45a82d014fadd6d8ea9086ecec221be5bcb5b93"
      - name: Benchmark V8 optimizer without publishing any changed contract
        run: node v8-test/optimizer-benchmark.mjs
