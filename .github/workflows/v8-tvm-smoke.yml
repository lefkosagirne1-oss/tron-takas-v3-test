name: V8 Nile TVM local smoke
on:
  push:
    paths:
      - 'contracts/TakasV8Invite.sol'
      - 'v6-test/dist/TakasV8Invite.json'
      - 'v8-test/tvm-smoke.mjs'
      - 'v8-test/tvm-state.mjs'
      - 'v8-test/nile-deploy-readonly.mjs'
      - 'v8-test/optimizer-benchmark.mjs'
      - 'v8-test/custom-error-messages.mjs'
      - '.github/workflows/v8-tvm-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nile-tvm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install pinned local TRON VM simulator
        run: npm install --no-save --package-lock=false --no-audit --no-fund @tvmjs/tvm@1.1.0 @tvmjs/util@1.1.0 @tvmjs/common@1.1.0 @tvmjs/block@1.0.1
      - name: Download pinned official TRON Solidity compiler for local TVM token tests and cost benchmark
        run: |
          mkdir -p v6-test/.cache
          curl --fail --location --retry 3 --silent --show-error --output v6-test/.cache/tron-soljson.cjs 'https://raw.githubusercontent.com/tronprotocol/solc-bin/main/wasm/soljson-v0.8.31+commit.c2812a3d.js'
          test "$(git hash-object v6-test/.cache/tron-soljson.cjs)" = "a45a82d014fadd6d8ea9086ecec221be5bcb5b93"
      - name: Run official tron-solc V8 and TRC20 runtime in local Nile TVM
        run: |
          node v8-test/tvm-smoke.mjs
          node v8-test/tvm-state.mjs
      - name: Probe real Nile unsigned deployment Energy (informational; no broadcast)
        continue-on-error: true
        run: node v8-test/nile-deploy-readonly.mjs
      - name: Benchmark V8 optimizer and test experimental custom errors in full local TVM
        run: |
          V8_CANDIDATE_ARTIFACT_PATH="${RUNNER_TEMP}/TakasV8Invite-custom-errors.json" node v8-test/optimizer-benchmark.mjs
          V8_TVM_ARTIFACT_PATH="${RUNNER_TEMP}/TakasV8Invite-custom-errors.json" node v8-test/tvm-state.mjs
      - name: Probe experimental V8 deployment Energy on real Nile without a signature
        continue-on-error: true
        env:
          V8_READONLY_CANDIDATE_ARTIFACT_PATH: ${{ runner.temp }}/TakasV8Invite-custom-errors.json
        run: node v8-test/nile-deploy-readonly.mjs
