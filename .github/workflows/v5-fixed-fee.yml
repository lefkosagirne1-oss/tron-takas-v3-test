name: V5 Fixed Fee Tests
on:
  push:
    paths:
      - 'contracts/TakasV5FixedFee.sol'
      - 'v5-test/fixed-fee.test.mjs'
      - 'v5-test/compile.mjs'
      - 'v5-test/check-ui.mjs'
      - 'v5-common.js'
      - 'v5-nile-yonetici.html'
      - 'v5-nile-katilimci.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v5-fixed-fee.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixed-fee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile V5
        run: npm run build:v5
      - name: Save V5 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-fixed-fee-compiled
          path: v5-test/dist/TakasV5FixedFee.json
          if-no-files-found: error
      - name: Test fixed-fee swaps
        run: npm run test:v5:fixed
      - name: Check V5 browser syntax and contract schema
        run: node v5-test/check-ui.mjs
      - name: Publish verified V5 deployment artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p v5-deploy
          cp v5-test/dist/TakasV5FixedFee.json v5-deploy/TakasV5FixedFee.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v5-deploy/TakasV5FixedFee.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(v5): publish tested contract deployment artifact [skip ci]'
            git push
          fi
