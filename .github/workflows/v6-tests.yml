name: V6 and V7 fixed-fee local tests
on:
  push:
    paths:
      - 'contracts/TakasV6Simple.sol'
      - 'contracts/TakasV7Fixed.sol'
      - 'contracts/TakasV8Invite.sol'
      - 'v6-test/**'
      - 'v6-common.js'
      - 'v6-nile-yonetici.html'
      - 'v6-nile-katilimci.html'
      - 'takas-common.js'
      - 'takas-yonetici.html'
      - 'takas-katilimci.html'
      - 'takas-kurulum.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v6-tests.yml'
  workflow_dispatch:
concurrency:
  group: v6-build-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Download pinned official TRON Solidity compiler
        run: |
          mkdir -p v6-test/.cache
          curl --fail --location --retry 3 --silent --show-error --output v6-test/.cache/tron-soljson.cjs 'https://raw.githubusercontent.com/tronprotocol/solc-bin/main/wasm/soljson-v0.8.31+commit.c2812a3d.js'
          test "$(git hash-object v6-test/.cache/tron-soljson.cjs)" = "a45a82d014fadd6d8ea9086ecec221be5bcb5b93"
      - run: node v6-test/build.mjs
      - run: node --test v6-test/simple.test.mjs v6-test/fixed.test.mjs v6-test/ui.test.mjs v6-test/invite.test.mjs v6-test/secure-ui.test.mjs
      - name: Check Nile chain read-only (optional external RPC; failures do not certify Nile)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://nile.trongrid.io/wallet/";
          async function read(path) {
            const response = await fetch(endpoint + path, {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: "{}",
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw Error(path + " HTTP " + response.status);
            return response.json();
          }
          const [block, params] = await Promise.all([read("getnowblock"), read("getchainparameters")]);
          const number = Number(block?.block_header?.raw_data?.number);
          const timestamp = Number(block?.block_header?.raw_data?.timestamp);
          const energyFee = Number(params?.chainParameter?.find(p => p.key === "getEnergyFee")?.value);
          if (!Number.isFinite(number) || number < 1 || !Number.isFinite(timestamp) ||
              Math.abs(Date.now() - timestamp) > 600000 || !Number.isFinite(energyFee) || energyFee <= 0)
            throw Error("Nile read-only RPC returned invalid block time or Energy price");
          console.log("Nile read-only OK: block", number, "Energy price (SUN)", energyFee);
          console.log("No deployment, deposit, approval, or TRX transfer performed.");
          NODE
      - name: Publish compiled V6 artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v6-test/dist/TakasV6Simple.json v6-test/dist/TakasV6Fixed.json v6-test/dist/TakasV8Invite.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v6): publish compiled contract artifact [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi
