name: V6 and V7 fixed-fee local tests
on:
  push:
    paths:
      - 'contracts/TakasV6Simple.sol'
      - 'contracts/TakasV7Fixed.sol'
      - 'v6-test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v6-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test v6-test/simple.test.mjs v6-test/fixed.test.mjs
      - run: node v6-test/build.mjs
      - name: Publish compiled V6 artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v6-test/dist/TakasV6Simple.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v6): publish compiled contract artifact [skip ci]"
            git push
          fi
