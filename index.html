<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1425"><title>Güvenli Takas · Nile</title>
<style>:root{color-scheme:dark;background:#0b1425;color:#edf4ff;font:16px/1.55 system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{max-width:560px;margin:10vh auto;padding:20px}main{padding:24px;border:1px solid #31435f;border-radius:18px;background:#132139}
h1{font-size:1.8rem;margin:0 0 8px}p{color:#cbd5e1}a.action{display:block;margin-top:24px;padding:16px;border-radius:12px;background:#3b82f6;color:white;text-align:center;text-decoration:none;font-weight:700}
small{display:block;color:#cbd5e1;margin-top:16px}</style></head>
<body><main><h1>Güvenli Takas</h1><p>TRON Nile test ağı · Yönetici paneli</p>
<a id="go" class="action" href="./takas-kurulum.html">Yönetici olarak başla</a>
<small id="hint">İlk kullanımda güvenli test sözleşmesi kurulmalıdır. Katılımcılar yalnız kendilerine gönderilen özel bağlantıyı açar.</small>
<small>Yalnızca Nile test varlıkları içindir. Gerçek para göndermeyin.</small>
</main><script>
try{
 const saved=localStorage.getItem("secure-takas-v8-contract");
 if(saved&&/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(saved)){
  document.getElementById("go").href="./takas-yonetici.html?secure=1&contract="+encodeURIComponent(saved);
  document.getElementById("go").textContent="Yönetici panelini aç";
  document.getElementById("hint").textContent="Kaydedilmiş sözleşme bağlantısı açılacak; cüzdan ve sözleşme kimliği panelde yeniden doğrulanır.";
 }
}catch(_){}
</script></body></html>
