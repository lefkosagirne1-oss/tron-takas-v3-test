<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>V4 salt-okunur kontrol</title><style>body{font:16px system-ui;background:#101a2c;color:white;max-width:750px;margin:auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2d48;padding:16px;border-radius:10px}</style><h2>V4 / Takas #1 — Salt okunur teşhis</h2><p>Bu sayfa cüzdan bağlamaz, imza istemez ve TRX harcamaz.</p><pre id="out">Nile verileri okunuyor…</pre><script>
(async()=>{const out=document.getElementById('out');const node='https://nile.trongrid.io';const contract='41122e4c3796cfd0f3dd097c55691d4acb122da15d';const tx='1c092eee6a9ffc1768bdc65ae371ab96f24cbd894f4a500072c633e400739c09';
const call=async(path,data)=>{const r=await fetch(node+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json()};
try{const [swap,info]=await Promise.all([call('/wallet/triggerconstantcontract',{owner_address:'41cf2833ae403ec21ab0da6a7dde8c70ece1d2ffbc',contract_address:contract,function_selector:'getSwap(uint256)',parameter:'1'.padStart(64,'0'),visible:false}),call('/wallet/gettransactioninfobyid',{value:tx})]);const hex=swap.constant_result?.[0]||'';const words=hex.match(/.{64}/g)||[];const names=['partyA','partyB','tokenA','tokenB','amountA','amountB','offerDeadline','depositDeadline','settlementDeadline','feeBps','feePayer','walletsConfirmed'];const decoded=Object.fromEntries(names.map((n,i)=>[n,words[i]||'eksik']));out.textContent=JSON.stringify({callResult:swap.result,swap:decoded,failedTx:{blockNumber:info.blockNumber,receipt:info.receipt,resMessage:info.resMessage,contractResult:info.contractResult},note:'Adresler ham 32-byte ABI kelimeleridir. Bu sayfa hiçbir işlem imzalamaz.'},null,2)}catch(e){out.textContent='Okuma hatası: '+e.message}})();
</script></html>
